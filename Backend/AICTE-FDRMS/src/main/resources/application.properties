spring.application.name=AICTE-FDRMS
server.port=${PORT:8080}

# MongoDB Connection via MONGODB_URL / MONGODB_URI / SPRING_DATA_MONGODB_URI
spring.mongodb.uri=${MONGODB_URL:${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/aicte_fdrms}}}
spring.mongodb.database=aicte_fdrms
spring.mongodb.authentication-database=admin
spring.data.mongodb.uri=${MONGODB_URL:${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/aicte_fdrms}}}
spring.data.mongodb.database=aicte_fdrms
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=false

# Strict file upload limits to mitigate resource exhaustion
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Information Disclosure Prevention (Disable stack traces and detailed error leaks)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.server-header=

# Logging level
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.org.springframework.security=INFO
logging.level.com.Muthu.AICTE_FDRMS=INFO
